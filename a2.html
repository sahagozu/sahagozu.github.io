<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patika Pro - Gelişmiş GPS & Rota Takip</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- PWA Manifest & Service Worker -->
    <link rel="manifest" href="data:application/manifest+json,{
      &quot;name&quot;: &quot;Patika Pro GPS&quot;,
      &quot;short_name&quot;: &quot;PatikaPro&quot;,
      &quot;start_url&quot;: &quot;.&quot;,
      &quot;display&quot;: &quot;standalone&quot;,
      &quot;background_color&quot;: &quot;#111827&quot;,
      &quot;theme_color&quot;: &quot;#1f2937&quot;,
      &quot;icons&quot;: [{&quot;src&quot;: &quot;https://cdn-icons-png.flaticon.com/512/854/854878.png&quot;, &quot;sizes&quot;: &quot;512x512&quot;, &quot;type&quot;: &quot;image/png&quot;}]
    }">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
            self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
            self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
          `)).catch(err => console.log('SW error:', err));
        });
      }
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111827; color: #f3f4f6; font-family: sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; z-index: 1; }
        
        /* HUD & Kontrol Paneli */
        .hud { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(8px); padding: 10px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        .control-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(8px); padding: 12px 20px; border-radius: 30px; display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn:active { transform: scale(0.95); background: #2563eb; }
        .btn-green { background: #10b981; }
        .btn-green:active { background: #059669; }
        .btn-purple { background: #8b5cf6; }
        .btn-purple:active { background: #7c3aed; }
        
        /* Hava Durumu & Widget */
        .weather-badge { background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <!-- Üst Bilgi (HUD) -->
    <div class="hud">
        <div>📍 <span id="coords">Konum Bekleniyor...</span></div>
        <div class="weather-badge" id="weatherBox">☁️ Hava yükleniyor...</div>
    </div>

    <!-- Harita Alanı -->
    <div id="map"></div>

    <!-- Alt Kontrol Paneli (Yeni Özellikler Entegre Edildi) -->
    <div class="control-panel">
        <button class="btn" onclick="triggerReplay()">▶️ Rota Oynat</button>
        <button class="btn btn-green" onclick="exportProjectWorkspace()">💾 Projeyi Arşivle</button>
        <button class="btn btn-purple" onclick="fetchWeather()">🌤️ Hava Durumu</button>
    </div>

    <!-- Harici Kütüphaneler (Leaflet, JSZip, Pako) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <script>
        // --- 1. HARİTA BAŞLANGICI ---
        const map = L.map('map', { zoomControl: false }).setView([39.9334, 32.8597], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- 2. INDEXEDDB VERİTABANI ALTYAPISI ---
        let db;
        const request = indexedDB.open("PatikaProDB", 1);
        request.onerror = e => console.error("IndexedDB Hatası:", e);
        request.onsuccess = e => {
            db = e.target.result;
            console.log("IndexedDB başarıyla bağlandı.");
        };
        request.onupgradeneeded = e => {
            let db = e.target.result;
            if (!db.objectStoreNames.contains("gpx_data")) db.createObjectStore("gpx_data", { keyPath: "id", autoIncrement: true });
            if (!db.objectStoreNames.contains("pins")) db.createObjectStore("pins", { keyPath: "id", autoIncrement: true });
        };

        // --- 3. HAVA DURUMU (OPEN-METEO API) ---
        async function fetchWeather() {
            let center = map.getCenter();
            try {
                let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${center.lat}&longitude=${center.lng}&current=temperature_2m,wind_speed_10m`);
                let data = await res.json();
                let temp = data.current.temperature_2m;
                let wind = data.current.wind_speed_10m;
                document.getElementById('weatherBox').innerText = `🌡️ ${temp}°C | 💨 ${wind} km/s`;
            } catch (e) {
                document.getElementById('weatherBox').innerText = "⚠️ Hava alınamadı";
            }
        }
        setTimeout(fetchWeather, 1500);

        // --- 4. ROTA OYNATICI (SİMÜLASYON) ---
        let sampleRoute = [
            [39.9334, 32.8597], [39.9350, 32.8620], [39.9380, 32.8650], [39.9410, 32.8700]
        ];
        let replayMarker = null;
        let replayTimer = null;

        function triggerReplay() {
            if (!replayMarker) {
                replayMarker = L.marker(sampleRoute[0], {
                    icon: L.divIcon({className: 'replay-ico', html: '📍', iconSize:
