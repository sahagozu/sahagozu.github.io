<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saha Gözü">
<title>Saha Gözü</title>
<script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/dist/mgrs.js"></script>
<style>
:root{--bg:#1e1e24;--panel:#2a2a35;--border:#3a3a4a;--acc:#007bff;--acc2:#0056b3;--text:#fff;--muted:#aaa}
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:calc(15px + env(safe-area-inset-top)) calc(15px + env(safe-area-inset-right)) calc(15px + env(safe-area-inset-bottom)) calc(15px + env(safe-area-inset-left));background:var(--bg);font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;gap:20px;min-height:100vh;min-height:100dvh;box-sizing:border-box;color:var(--text)}
@media(min-width:768px){body{flex-direction:row}}
#splash{position:fixed;inset:0;background:#0b0b0e;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .8s,visibility .8s}
.brand{font-size:38px;font-weight:900;letter-spacing:6px;margin-bottom:25px}
.radar{width:80px;height:80px;border:4px solid rgba(0,123,255,.1);border-radius:50%;border-top-color:var(--acc);border-bottom-color:var(--acc);animation:spin 1s cubic-bezier(.68,-.55,.27,1.55) infinite;margin:0 auto 20px}
.ltxt{color:var(--acc);font-family:'Courier New',monospace;font-size:16px;font-weight:bold;letter-spacing:3px;white-space:nowrap;overflow:hidden;border-right:3px solid var(--acc);width:23ch;animation:typing 2s steps(23,end),caret .75s step-end infinite}
.pbc{width:240px;height:6px;background:var(--panel);border-radius:3px;margin:20px auto 0;overflow:hidden;border:1px solid var(--border)}
#pbar{width:0;height:100%;background:var(--acc);transition:width 5s linear}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes typing{from{width:0}to{width:23ch}}
@keyframes caret{50%{border-color:transparent}}
.fade-out{opacity:0;visibility:hidden;pointer-events:none}
.control-panel{flex:1;width:100%;background:var(--panel);padding:20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;height:fit-content;border:1px solid var(--border);box-sizing:border-box}
@media(min-width:768px){.control-panel{max-width:360px}}
.ig{display:flex;flex-direction:column;gap:5px}
.ig label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:8px;align-items:center}
/* iOS: 16px altı yazı odaklanınca otomatik yakınlaştırır */
input[type=text],select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:16px;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;border-radius:6px}
select{background-image:linear-gradient(45deg,transparent 50%,#aaa 50%),linear-gradient(135deg,#aaa 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=file]{color:var(--muted);font-size:16px}
.btn{-webkit-appearance:none;appearance:none;background:var(--acc);color:#fff;border:none;padding:10px 12px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;touch-action:manipulation;font-family:inherit}
.btn:active{background:var(--acc2)}
.btn.on{background:#e0a800;color:#000}
.btn.danger{background:#dc3545}
.row .btn{flex:1}
#arrow-color{width:44px;height:38px;border:none;background:none;padding:0;-webkit-appearance:none}
.download-btn{background:#28a745;padding:14px;font-size:16px;display:none;width:100%}
.download-btn:disabled{background:#6c757d}
.preview-area{flex:2;display:flex;justify-content:center;align-items:center;background:#0b0b0e;border-radius:12px;padding:10px;border:1px solid var(--border);overflow:hidden;width:100%;box-sizing:border-box;min-height:400px}
.tc{position:relative;display:inline-block;max-width:100%;background:#000;overflow:hidden;margin:0 auto}
.wm{position:absolute;background:#fff;color:#000;padding:3px 8px;font-weight:bold;font-size:16px;font-family:Arial,Helvetica,sans-serif;z-index:10;white-space:nowrap;line-height:1.2;pointer-events:none}
.tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}
.main-image{max-width:100%;height:auto;max-height:70vh;max-height:70dvh;display:block;object-fit:contain;-webkit-touch-callout:none}
@media(min-width:768px){.main-image{max-height:80vh}}
.ph{padding:60px 20px;text-align:center;color:#666;font-style:italic;border:2px dashed #444;border-radius:8px;width:100%;box-sizing:border-box}
#draw-canvas{position:absolute;top:0;left:0;z-index:5;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#draw-canvas.active{pointer-events:auto;touch-action:none;cursor:crosshair}
#draw-canvas.move-mode{pointer-events:auto;touch-action:none;cursor:move}
/* Kaydetme penceresi (iOS yedek yöntem) */
#save-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(15px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom));box-sizing:border-box}
#save-modal img{max-width:100%;max-height:68vh;max-height:68dvh;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto}
#save-modal p{margin:0;text-align:center;font-size:14px;color:var(--muted)}
#save-modal .row{width:100%;max-width:360px}
</style>
</head>
<body>

<div id="splash">
  <div class="brand">SAHA GÖZÜ</div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="radar"></div>
    <div class="ltxt">SİSTEM YÜKLENİYOR...</div>
    <div class="pbc"><div id="pbar"></div></div>
  </div>
</div>

<div class="control-panel">
  <div class="ig">
    <label style="color:var(--acc);font-weight:bold">Tasarım Ve Kodlama</label>
    <label style="color:var(--text)">Oğuzhan EMİRLİOĞLU</label>
  </div>
  <div class="ig">
    <label for="input-date">Tarih / Kod (Sol Üst)</label>
    <div class="row"><input type="text" id="input-date" value="Saat Ve Tarih" autocomplete="off" autocapitalize="characters"><button id="time-btn" class="btn" type="button" style="flex:none">⏱ Çek</button></div>
  </div>
  <div class="ig">
    <label for="input-name">İsim / Birlik (Sağ Üst)</label>
    <input type="text" id="input-name" value="SARKE ÜB." autocomplete="off" autocapitalize="characters">
  </div>
  <div class="ig">
    <label for="input-coord">MGRS / Konum Bilgisi (Sol Alt)</label>
    <div class="row"><input type="text" id="input-coord" value="Koordinat" autocomplete="off" autocapitalize="characters"><button id="gps-btn" class="btn" type="button" style="flex:none">📍 Çek</button></div>
  </div>
  <div class="ig">
    <label>Filigran Yazı Boyutu (<span id="fontSize-val">16</span>px)</label>
    <input type="range" id="font-size-range" min="10" max="36" value="16">
  </div>
  <div class="ig">
    <label for="image-upload">Fotoğraf Yükle</label>
    <input type="file" id="image-upload" accept="image/*">
  </div>

  <div class="ig" id="draw-tools" style="display:none;border-top:1px solid var(--border);padding-top:10px">
    <label style="color:var(--acc)">Çizim & Metin Araçları</label>
    <div class="row">
      <button id="arrow-btn" class="btn" type="button">➜ Ok</button>
      <button id="rect-btn" class="btn" type="button">▢ Kutu</button>
      <button id="text-btn" class="btn" type="button">💬 Metin</button>
      <button id="move-btn" class="btn" type="button">✋ Taşı</button>
    </div>
    <div class="row">
      <input type="color" id="arrow-color" value="#ff0000">
      <select id="rect-style">
        <option value="fill">Kutu: Tam Dolu</option>
        <option value="semi">Kutu: Yarı Şeffaf</option>
        <option value="stroke">Kutu: Çerçeve</option>
      </select>
    </div>
    <div class="ig">
      <label>Çizim / Metin Font Boyutu (<span id="draw-font-val">24</span>px)</label>
      <input type="range" id="draw-font-size" min="12" max="72" value="24">
    </div>
    <div class="ig">
      <label for="draw-font-family">Metin Font Tipi</label>
      <select id="draw-font-family">
        <option value="Arial, sans-serif">Arial</option>
        <option value="Impact, sans-serif">Impact</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
    </div>
    <div class="ig" id="text-input-group" style="display:none">
      <label for="text-content">Metin İçeriği</label>
      <input type="text" id="text-content" placeholder="Eklenecek yazıyı yazın..." autocomplete="off">
    </div>
    <div class="row">
      <button id="delete-selected-btn" class="btn danger" type="button" style="display:none">❌ Sil</button>
      <button id="undo-btn" class="btn" type="button">↩ Geri Al</button>
      <button id="clear-btn" class="btn" type="button">🗑 Temizle</button>
    </div>
  </div>

  <button id="download-btn" class="btn download-btn">🛡 EXIF Temizle & Kaydet</button>
</div>

<div class="preview-area">
  <div id="placeholder-box" class="ph">Lütfen sol panelden bir fotoğraf yükleyin...</div>
  <div id="template-wrapper" class="tc" style="display:none">
    <div class="wm tl" id="view-date">SAAT VE TARİH</div>
    <div class="wm tr" id="view-name">SARKE ÜB.</div>
    <div class="wm bl" id="view-coord">KOORDİNAT</div>
    <img id="preview-img" class="main-image" src="" alt="Önizleme">
  </div>
</div>

<!-- Kaydetme penceresi -->
<div id="save-modal">
  <img id="save-img" alt="Sonuç">
  <p>Paylaş menüsünden <b>“Görüntüyü Kaydet”</b> seç<br>veya resme basılı tutup <b>“Fotoğraflara Ekle”</b> de.</p>
  <div class="row">
    <button id="share-again" class="btn" type="button" style="background:#28a745">⬆ Paylaş / Kaydet</button>
    <button id="close-modal" class="btn" type="button" style="background:#6c757d">Kapat</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// --- AÇILIŞ + SES ---
// iOS, kullanıcı dokunuşu olmadan sesi çalmaz; engellenirse ilk dokunuşta çalınır.
// Not: "ses.mp3" dosyasını HTML ile aynı klasöre koyun (iOS uygulamasında paket içine ekleyin).
const splash = $('splash');
const ses = new Audio('ses.mp3');
ses.preload = 'auto';
let sesCalindi = false;
function sesCal() {
    if (sesCalindi) return;
    const p = ses.play();
    if (p && p.then) p.then(() => { sesCalindi = true; }).catch(() => {});
    else sesCalindi = true;
}
['touchstart', 'pointerdown', 'click'].forEach(ev =>
    document.addEventListener(ev, () => { if (!splash.classList.contains('fade-out')) sesCal(); }, { passive: true })
);
window.addEventListener('DOMContentLoaded', () => {
    sesCal();
    setTimeout(() => { $('pbar').style.width = '100%'; }, 50);
    setTimeout(() => { splash.classList.add('fade-out'); }, 5000);
    try {
        const n = localStorage.getItem('askeri_filigran_isim');
        if (n) { inputName.value = n; viewName.textContent = n; }
    } catch (e) {}
});

// --- ELEMENTLER ---
const inputDate = $('input-date'), inputName = $('input-name'), inputCoord = $('input-coord');
const imageUpload = $('image-upload'), downloadBtn = $('download-btn');
const gpsBtn = $('gps-btn'), timeBtn = $('time-btn');
const viewDate = $('view-date'), viewName = $('view-name'), viewCoord = $('view-coord');
const placeholderBox = $('placeholder-box'), templateWrapper = $('template-wrapper'), previewImg = $('preview-img');

inputDate.addEventListener('input', () => { viewDate.textContent = inputDate.value; });
inputName.addEventListener('input', () => {
    viewName.textContent = inputName.value;
    try { localStorage.setItem('askeri_filigran_isim', inputName.value); } catch (e) {}
});
inputCoord.addEventListener('input', () => { viewCoord.textContent = inputCoord.value; });

const fontSizeRange = $('font-size-range');
fontSizeRange.addEventListener('input', e => {
    $('fontSize-val').textContent = e.target.value;
    document.querySelectorAll('.wm').forEach(b => { b.style.fontSize = e.target.value + 'px'; });
});

// --- ASKERİ DTG ---
timeBtn.addEventListener('click', () => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const aylar = ["OCA","SUB","MAR","NIS","MAY","HAZ","TEM","AGU","EYL","EKI","KAS","ARA"];
    const f = `${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}C ${aylar[d.getMonth()]} ${String(d.getFullYear()).slice(-2)}`;
    inputDate.value = f; viewDate.textContent = f;
});

// --- GPS & MGRS (iOS'ta HTTPS veya uygulama içi izin gerekir) ---
gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) return alert("Tarayıcınız konum özelliğini desteklemiyor.");
    gpsBtn.textContent = "⌛...";
    navigator.geolocation.getCurrentPosition(pos => {
        try {
            const m = mgrs.forward([pos.coords.longitude, pos.coords.latitude]);
            const s = `${m.substring(0, 5)} ${m.substring(5, 10)} ${m.substring(10, 15)}`;
            inputCoord.value = s; viewCoord.textContent = s;
        } catch (e) { alert("Koordinat dönüşümünde hata oluştu."); }
        gpsBtn.textContent = "📍 Çek";
    }, () => {
        alert("Konum alınamadı. Ayarlar > Gizlilik > Konum Servisleri izinlerini kontrol edin.");
        gpsBtn.textContent = "📍 Çek";
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
});

// --- DİKEY → YATAY (16:9) ---
function dikeydenYatayaKirp(img, cb) {
    const c = document.createElement('canvas'), x = c.getContext('2d');
    const tw = 1920, th = 1080; c.width = tw; c.height = th;
    const ta = tw / th, ia = img.naturalWidth / img.naturalHeight;
    let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
    if (ia < ta) { sh = sw / ta; sy = (img.naturalHeight - sh) / 2; }
    else { sw = sh * ta; sx = (img.naturalWidth - sw) / 2; }
    x.drawImage(img, sx, sy, sw, sh, 0, 0, tw, th);
    cb(c.toDataURL('image/jpeg', 0.95));
}

// --- RESİM YÜKLEME (ObjectURL: iOS'ta bellek dostu) ---
let objUrl = null;
imageUpload.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(file);
    const t = new Image();
    t.onload = () => {
        if (t.naturalHeight > t.naturalWidth) dikeydenYatayaKirp(t, u => previewImg.src = u);
        else previewImg.src = objUrl;
        placeholderBox.style.display = 'none';
        templateWrapper.style.display = 'inline-block';
        downloadBtn.style.display = 'flex';
    };
    t.onerror = () => alert("Fotoğraf açılamadı.");
    t.src = objUrl;
});

// --- ÇİZİM SİSTEMİ ---
const overlay = document.createElement('canvas');
overlay.id = 'draw-canvas';
templateWrapper.appendChild(overlay);
const octx = overlay.getContext('2d');

const arrowBtn = $('arrow-btn'), rectBtn = $('rect-btn'), textBtn = $('text-btn'), moveBtn = $('move-btn');
const arrowColor = $('arrow-color'), rectStyle = $('rect-style'), drawTools = $('draw-tools');
const drawFontSize = $('draw-font-size'), drawFontVal = $('draw-font-val'), drawFontFamily = $('draw-font-family');
const textInputGroup = $('text-input-group'), textContent = $('text-content'), deleteBtn = $('delete-selected-btn');

let shapes = [], current = null, tool = null, sel = -1, isDragging = false, dragOffset = { x: 0, y: 0 };
const selShape = () => (sel !== -1 ? shapes[sel] : null);

drawFontSize.addEventListener('input', e => {
    drawFontVal.textContent = e.target.value;
    if (selShape()) { selShape().size = parseInt(e.target.value); redraw(); }
});
arrowColor.addEventListener('input', e => { if (selShape()) { selShape().color = e.target.value; redraw(); } });
rectStyle.addEventListener('change', e => { const s = selShape(); if (s && s.type === 'rect') { s.rectStyle = e.target.value; redraw(); } });
drawFontFamily.addEventListener('change', e => { const s = selShape(); if (s && s.type === 'text') { s.fontFamily = e.target.value; redraw(); } });
textContent.addEventListener('input', e => { const s = selShape(); if (s && s.type === 'text') { s.text = e.target.value; redraw(); } });

function drawShape(c, s, W, H, isSel) {
    c.save();
    c.shadowColor = 'transparent'; c.shadowBlur = 0;
    const lw = Math.max(3, ((s.size || 24) / 24) * (W * 0.005));
    c.strokeStyle = c.fillStyle = s.color || '#ff0000';
    c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';

    if (s.type === 'rect') {
        const x1 = s.x1 * W, y1 = s.y1 * H, x2 = s.x2 * W, y2 = s.y2 * H;
        const rx = Math.min(x1, x2), ry = Math.min(y1, y2), rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
        const st = s.rectStyle || 'fill';
        if (st === 'fill') c.fillRect(rx, ry, rw, rh);
        else if (st === 'semi') { c.save(); c.globalAlpha = 0.4; c.fillRect(rx, ry, rw, rh); c.restore(); c.strokeRect(rx, ry, rw, rh); }
        else c.strokeRect(rx, ry, rw, rh);
        if (isSel) { c.strokeStyle = '#007bff'; c.lineWidth = 2; c.setLineDash([6, 6]); c.strokeRect(rx - 4, ry - 4, rw + 8, rh + 8); }
    } else if (s.type === 'arrow') {
        const x1 = s.x1 * W, y1 = s.y1 * H, x2 = s.x2 * W, y2 = s.y2 * H;
        const head = lw * 5, ang = Math.atan2(y2 - y1, x2 - x1);
        c.beginPath(); c.moveTo(x1, y1);
        c.lineTo(x2 - Math.cos(ang) * head * 0.6, y2 - Math.sin(ang) * head * 0.6); c.stroke();
        c.beginPath(); c.moveTo(x2, y2);
        c.lineTo(x2 - head * Math.cos(ang - Math.PI / 7), y2 - head * Math.sin(ang - Math.PI / 7));
        c.lineTo(x2 - head * Math.cos(ang + Math.PI / 7), y2 - head * Math.sin(ang + Math.PI / 7));
        c.closePath(); c.fill();
        if (isSel) {
            c.strokeStyle = '#007bff'; c.lineWidth = 2; c.setLineDash([4, 4]);
            c.beginPath(); c.arc(x1, y1, 6, 0, Math.PI * 2); c.moveTo(x2 + 6, y2); c.arc(x2, y2, 6, 0, Math.PI * 2); c.stroke();
        }
    } else if (s.type === 'text') {
        const x = s.x1 * W, y = s.y1 * H, fpx = Math.round((s.size || 24) * (W / 1000));
        c.font = `bold ${fpx}px ${s.fontFamily || 'Arial, sans-serif'}`;
        c.textBaseline = 'top';
        c.fillText(s.text || '', x, y);
        if (isSel) {
            const tw = c.measureText(s.text || '').width;
            c.strokeStyle = '#007bff'; c.lineWidth = 2; c.setLineDash([4, 4]);
            c.strokeRect(x - 4, y - 4, tw + 8, fpx * 1.2 + 8);
        }
    }
    c.restore();
}

function redraw() {
    const dpr = window.devicePixelRatio || 1;
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, overlay.width, overlay.height);
    octx.scale(dpr, dpr);
    const W = overlay.width / dpr, H = overlay.height / dpr;
    shapes.forEach((s, i) => drawShape(octx, s, W, H, i === sel));
    if (current) drawShape(octx, current, W, H, false);
    deleteBtn.style.display = sel !== -1 ? 'flex' : 'none';
}

function resizeCanvas() {
    const r = previewImg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = window.devicePixelRatio || 1;
    overlay.style.width = r.width + 'px'; overlay.style.height = r.height + 'px';
    overlay.width = Math.round(r.width * dpr); overlay.height = Math.round(r.height * dpr);
    redraw();
}

previewImg.addEventListener('load', () => {
    shapes = []; current = null; sel = -1;
    drawTools.style.display = 'flex';
    resizeCanvas();
});
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 300));
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(previewImg);

function setTool(t) {
    tool = tool === t ? null : t;
    overlay.classList.toggle('active', !!tool && tool !== 'move');
    overlay.classList.toggle('move-mode', tool === 'move');
    overlay.style.pointerEvents = tool ? 'auto' : 'none';
    arrowBtn.classList.toggle('on', tool === 'arrow');
    rectBtn.classList.toggle('on', tool === 'rect');
    textBtn.classList.toggle('on', tool === 'text');
    moveBtn.classList.toggle('on', tool === 'move');
    if (tool !== 'move') sel = -1;
    const s = selShape();
    textInputGroup.style.display = (tool === 'text' || (s && s.type === 'text')) ? 'flex' : 'none';
    redraw();
}
arrowBtn.onclick = () => setTool('arrow');
rectBtn.onclick = () => setTool('rect');
textBtn.onclick = () => setTool('text');
moveBtn.onclick = () => setTool('move');

function getPos(e) {
    const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    const r = overlay.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (t.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (t.clientY - r.top) / r.height)) };
}

function hitTest(p) {
    const dpr = window.devicePixelRatio || 1, W = overlay.width / dpr, H = overlay.height / dpr;
    for (let i = shapes.length - 1; i >= 0; i--) {
        const s = shapes[i];
        if (s.type === 'rect') {
            const rx = Math.min(s.x1, s.x2), ry = Math.min(s.y1, s.y2);
            if (p.x >= rx && p.x <= rx + Math.abs(s.x2 - s.x1) && p.y >= ry && p.y <= ry + Math.abs(s.y2 - s.y1)) return i;
        } else if (s.type === 'arrow') {
            const dx = s.x2 - s.x1, dy = s.y2 - s.y1, len = Math.hypot(dx, dy);
            if (!len) continue;
            const u = ((p.x - s.x1) * dx + (p.y - s.y1) * dy) / (len * len);
            if (u >= 0 && u <= 1 && Math.hypot(p.x - (s.x1 + u * dx), p.y - (s.y1 + u * dy)) < 0.04) return i;
        } else if (s.type === 'text') {
            const fpx = Math.round((s.size || 24) * (W / 1000));
            octx.font = `bold ${fpx}px ${s.fontFamily || 'Arial'}`;
            const tw = octx.measureText(s.text || '').width / W, th = (fpx * 1.2) / H;
            if (p.x >= s.x1 - 0.02 && p.x <= s.x1 + tw + 0.02 && p.y >= s.y1 - 0.02 && p.y <= s.y1 + th + 0.02) return i;
        }
    }
    return -1;
}

function startDraw(e) {
    if (!tool) return;
    e.preventDefault();
    const p = getPos(e);
    if (tool === 'move') {
        const h = hitTest(p);
        sel = h;
        if (h !== -1) {
            isDragging = true;
            const s = shapes[h];
            dragOffset = { x: p.x - s.x1, y: p.y - s.y1 };
            if (s.type === 'text') { textContent.value = s.text || ''; textInputGroup.style.display = 'flex'; }
        }
        redraw();
        return;
    }
    if (tool === 'text') {
        shapes.push({ type: 'text', x1: p.x, y1: p.y, x2: p.x, y2: p.y, text: textContent.value.trim() || 'Metin',
            color: arrowColor.value, size: parseInt(drawFontSize.value), fontFamily: drawFontFamily.value });
        redraw();
        return;
    }
    current = { type: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y, color: arrowColor.value, rectStyle: rectStyle.value, size: parseInt(drawFontSize.value) };
}

function moveDraw(e) {
    if (!tool) return;
    const p = getPos(e);
    if (isDragging && sel !== -1) {
        e.preventDefault();
        const s = shapes[sel], dx = s.x2 - s.x1, dy = s.y2 - s.y1;
        s.x1 = p.x - dragOffset.x; s.y1 = p.y - dragOffset.y; s.x2 = s.x1 + dx; s.y2 = s.y1 + dy;
        redraw();
        return;
    }
    if (!current) return;
    e.preventDefault();
    current.x2 = p.x; current.y2 = p.y;
    redraw();
}

function endDraw(e) {
    if (isDragging) { isDragging = false; return; }
    if (!current) return;
    if (e && e.cancelable) e.preventDefault();
    if (Math.hypot(current.x2 - current.x1, current.y2 - current.y1) > 0.015 || current.type === 'rect') shapes.push(current);
    current = null;
    redraw();
}

overlay.addEventListener('touchstart', startDraw, { passive: false });
overlay.addEventListener('touchmove', moveDraw, { passive: false });
overlay.addEventListener('touchend', endDraw, { passive: false });
overlay.addEventListener('touchcancel', endDraw, { passive: false });
overlay.addEventListener('mousedown', startDraw);
window.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);

deleteBtn.onclick = () => { if (sel !== -1) { shapes.splice(sel, 1); sel = -1; redraw(); } };
$('undo-btn').onclick = () => { shapes.pop(); sel = -1; redraw(); };
$('clear-btn').onclick = () => { shapes = []; sel = -1; redraw(); };

// --- DIŞA AKTARMA ---
// html2canvas yerine doğrudan canvas'a çizilir (iOS Safari'de daha güvenilir).
// Canvas'a çizmek EXIF/konum verisini kendiliğinden siler.
function exportCanvas() {
    let w = previewImg.naturalWidth, h = previewImg.naturalHeight;
    const MAX = 4096; // iOS canvas bellek sınırına karşı
    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.drawImage(previewImg, 0, 0, w, h);

    shapes.forEach(s => drawShape(x, s, w, h, false));

    const dw = previewImg.getBoundingClientRect().width || w;
    const k = w / dw;
    const fs = parseInt(fontSizeRange.value) * k, padX = 8 * k, padY = 3 * k, bh = fs * 1.2 + padY * 2;
    x.font = `bold ${fs}px Arial, Helvetica, sans-serif`;
    x.textBaseline = 'middle';
    [[viewDate.textContent, 'tl'], [viewName.textContent, 'tr'], [viewCoord.textContent, 'bl']].forEach(([t, pos]) => {
        const bw = x.measureText(t).width + padX * 2;
        const bx = pos === 'tr' ? w - bw : 0, by = pos === 'bl' ? h - bh : 0;
        x.fillStyle = '#fff'; x.fillRect(bx, by, bw, bh);
        x.fillStyle = '#000'; x.fillText(t, bx + padX, by + bh / 2);
    });
    return c;
}

const modal = $('save-modal'), saveImg = $('save-img');
let lastFile = null, lastUrl = null;

async function paylas() {
    if (!lastFile) return false;
    if (navigator.canShare && navigator.canShare({ files: [lastFile] })) {
        try { await navigator.share({ files: [lastFile] }); return true; }
        catch (e) { if (e.name === 'AbortError') return true; }
    }
    return false;
}

function modalAc(blob) {
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    saveImg.src = lastUrl;
    modal.style.display = 'flex';
}

$('share-again').onclick = async () => {
    if (!(await paylas())) {
        const a = document.createElement('a');
        a.href = lastUrl; a.download = lastFile.name;
        document.body.appendChild(a); a.click(); a.remove();
    }
};
$('close-modal').onclick = () => { modal.style.display = 'none'; };

downloadBtn.addEventListener('click', () => {
    const txt = downloadBtn.textContent;
    downloadBtn.textContent = "⌛ EXIF Temizleniyor & İşleniyor...";
    downloadBtn.disabled = true;
    setTimeout(() => {
        try {
            exportCanvas().toBlob(async blob => {
                downloadBtn.textContent = txt; downloadBtn.disabled = false;
                if (!blob) return alert("Resim oluşturulamadı.");
                lastFile = new File([blob], `faaliyet_fotografi_${Date.now()}.jpg`, { type: 'image/jpeg' });
                const ok = await paylas();   // Paylaş menüsü → "Görüntüyü Kaydet"
                if (!ok) modalAc(blob);      // Olmazsa yedek pencere
            }, 'image/jpeg', 0.92);
        } catch (err) {
            console.error(err);
            alert("Resim işlenirken bir hata oluştu.");
            downloadBtn.textContent = txt; downloadBtn.disabled = false;
        }
    }, 30);
});
</script>
